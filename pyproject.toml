[project]
name = "expergis"
version = "0.1.0"
description = "Plugin-based event watcher for Claude Code — perception complement to Velle's volition"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "aiohttp>=3.9.0",
    "croniter>=1.3.0",
]

[project.optional-dependencies]
events = ["mcp==2.3.0", "PyJWT[crypto]>=2.10.1,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/expergis"]

[project.scripts]
expergis = "expergis.server:main"
expergis-auth-preflight = "expergis.auth0:main"

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
]
